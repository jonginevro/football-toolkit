# =============================================================================
# Manual catalysts: the human-judgment signals stats can't see. A new
# coaching staff, a scheme change, an aging starter ahead, camp buzz.
#
# These nudge the LIVE board only (they have no history, so they're never part
# of the backtest). Each value is a 0..1 confidence; a player's team + player
# notes are summed, capped at 1, and a maxed-out note adds +1.0 log-odds
# (roughly 2.7x the odds). They show up as a red "notes" bar on the site.
#
#   teams:   apply to every skill player on the team (by team abbreviation)
#   players: apply to one player (matched by full name, case-insensitive)
# =============================================================================

teams: {}
  # PIT:
  #   new_coaching_staff: 0.5

players: {}
  # "Kaleb Johnson":
  #   injury_or_age_ahead: 0.6
  #   camp_riser: 0.3
